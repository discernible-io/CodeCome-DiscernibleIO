project:
  name: "idclawserver-idc"
  source_path: "./src"
  profile: "auto"
  languages:
    - "javascript"

target:
  description: "IdentyClaw HTTP API (Express/Node) for AI agent identities on NEAR with HOLA mutual authentication and JWT API login."
  assumptions:
    - "Primary stack is Node.js + Express; auth uses Ed25519 login signatures (JWT) and HOLA slash-separated peer identity lines."
    - "External NEAR RPC / Passport / mint services may be unavailable in sandbox; prefer static proof and local unit tests when runtime deps are missing."
    - "Container runtime on this host is Podman (docker CLI is a podman shim); use podman-compose from the workspace .venv, never Docker Desktop."
    - "Target-specific logic must live in skills, notes, or adapters, not in the core workflow."

audit:
  mode: "sequential"

  phases:
    - reconnaissance
    - hypothesis_generation
    - counter_analysis
    - validation
    - exploit_development
    - reporting

  semantic_deduplication:
    enabled: true
    phase: "counter_analysis"
    compare_fields:
      - "category"
      - "target_area"
      - "files"
      - "symbols"
      - "entry_points"
      - "sources"
      - "sinks"
      - "trust_boundary"
      - "assets_at_risk"

  extra_prompts:
    reconnaissance: |
      Host container engine is Podman. Prefer podman / podman-compose (workspace .venv).
      Do not require Docker Engine. Reuse templates/sandboxes/node and adapt for Express.
      High-value areas: src/app.js routes, login/JWT, HOLA verify, METHOD_PERMISSION_MAP,
      nginx config, api.Dockerfile, config/, and crypto helpers.
    hypothesis_generation: |
      Prioritize auth bypass, signature verification flaws, JWT handling, HOLA nonce/replay,
      authorization gaps vs METHOD_PERMISSION_MAP, SSRF via outbound HTTP, secret leakage,
      and unsafe request parsing. Skip memory-safety classes (N/A for Node).
    counter_analysis: |
      Reject findings that require production-only ingress without a local reproduction path.
      Keep NEEDS_VALIDATION when NEAR RPC or external Passport is required.

  scope:
    include:
      - "src/**"
    exclude:
      - "src/**/.git/**"
      - "src/**/.svn/**"
      - "src/**/.hg/**"
      - "src/**/node_modules/**"
      - "src/**/vendor/**"
      - "src/**/packages/**"
      - "src/**/bin/**"
      - "src/**/obj/**"
      - "src/**/target/**"
      - "src/**/build/**"
      - "src/**/dist/**"
      - "src/**/.next/**"
      - "src/**/.gradle/**"
      - "src/**/.idea/**"
      - "src/**/.vscode/**"
      - "src/**/private-docs/**"
      - "src/**/.tmp-funnel/**"
      - "src/**/identyclaw-skill/**"
      - "src/**/identyclaw-a2a-trust-skill/**"
      - "src/**/hermes-identyclaw-skill/**"
      - "src/**/examples/**"

  focus:
    - "Authentication and authorization flaws"
    - "Cryptographic misuse"
    - "JWT and session handling"
    - "HOLA mutual authentication / replay"
    - "Injection vulnerabilities"
    - "Server-side request forgery"
    - "Secrets exposure"
    - "Business logic vulnerabilities"
    - "Supply chain risks"
    - "Insecure configuration"
    - "Improper input validation"
    - "Privilege escalation"
    - "Race conditions"

  static_analysis:
    codeql:
      enabled: true
      fail_policy: "soft"

      pack_catalog: "./templates/codeql-packs.yml"

      install:
        managed: true
        version: "latest"

      output_dir: "./itemdb/codeql"
      database_dir: "./itemdb/codeql/databases"
      cache_dir: "./.cache/codeql"

      phase_1:
        enabled: true

      phase_2:
        enabled: true
        candidate_mode: "precreate"
        max_candidates: 10

      sweep:
        enabled: true
        inject_context: true

environment:
  type: "sandbox"
  path: "./sandbox"
  startup_command: "./sandbox/scripts/up.sh"
  shell_command: "./sandbox/scripts/shell.sh"
  reset_command: "./sandbox/scripts/reset.sh"
  logs_command: "./sandbox/scripts/logs.sh"
  clean_command: "./sandbox/scripts/clean.sh"

validation:
  worker_count: 1
  allow_destructive_actions_inside_sandbox: true
  allow_source_modification: false

  allowed_write_paths:
    - "./itemdb"
    - "./runs"
    - "./sandbox"
    - "./tmp"
    - "/workspace/itemdb"
    - "/workspace/runs"
    - "/workspace/sandbox"
    - "/workspace/tmp"

  methods:
    - "static_proof"
    - "unit_test"
    - "integration_test"
    - "runtime_reproduction"
    - "sanitizer_detection"
    - "crash_reproduction"
    - "http_exploit"
    - "cli_exploit"
    - "file_based_trigger"
    - "config_based_trigger"
    - "symbolic_or_manual_trace"
    - "benchmark_oracle_comparison"

  confirmation_policy:
    - "A finding may only be marked CONFIRMED when clear evidence exists."
    - "Benchmark labels alone are not enough to mark a finding CONFIRMED."
    - "If runtime validation is not practical, a strong static proof may be acceptable, but the limitation must be documented."
    - "If assumptions cannot be validated, keep the finding in PENDING or move it to REJECTED."

reporting:
  format: "markdown"
  findings_dir: "./itemdb/findings"
  evidence_dir: "./itemdb/evidence"
  reports_dir: "./itemdb/reports"
  default_status: "PENDING"

finding:
  id_prefix: "CC"
  template: "./templates/finding.md"

  statuses:
    - "PENDING"
    - "CONFIRMED"
    - "EXPLOITED"
    - "REJECTED"
    - "DUPLICATE"

  severities:
    - "CRITICAL"
    - "HIGH"
    - "MEDIUM"
    - "LOW"
    - "INFO"

  confidences:
    - "LOW"
    - "MEDIUM"
    - "HIGH"
    - "CONFIRMED"

skills:
  directory: "./.opencode/skills"
  selection_policy:
    - "Use generic skills by default."
    - "Use target-specific skills only when the target profile, language, or framework matches."
    - "Do not hardcode the workflow around a single target type."

agents:
  directory: "./.opencode/agents"
  default_mode: "single_agent_sequential"

  recon:
    model: "cursor/composer-2.5"
  auditor:
    model: "cursor/composer-2.5"
  reviewer:
    model: "cursor/composer-2.5"
  validator:
    model: "cursor/composer-2.5"
  reporter:
    model: "cursor/composer-2.5"

